# ServiceAccount for data refresh cronjob
# Grants permission to kubectl exec into admin-web pod to extract payment data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cyber-sales-data-fetcher
  namespace: cyber-sales  # Must match Terraform namespace

---
# Role: Allows executing commands in admin-web pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin-pod-exec
  namespace: hedgeye-apps-vf4dc  # Namespace where admin-web pod lives
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "create"]
  # Limit to only admin-web pods for security
  # Remove resourceNames if pod name changes frequently
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

---
# RoleBinding: Links ServiceAccount to Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cyber-sales-can-exec-admin
  namespace: hedgeye-apps-vf4dc  # Same namespace as Role
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: admin-pod-exec
subjects:
- kind: ServiceAccount
  name: cyber-sales-data-fetcher
  namespace: cyber-sales  # ServiceAccount's namespace

---
# ClusterRole: Allows listing pods across namespaces (for finding admin-web pod)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cyber-sales-pod-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
  # Restricted to specific namespace in ClusterRoleBinding

---
# ClusterRoleBinding: Limited to reading pods in hedgeye-apps namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cyber-sales-read-admin-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cyber-sales-pod-reader
subjects:
- kind: ServiceAccount
  name: cyber-sales-data-fetcher
  namespace: cyber-sales
